name: Render Fox Short V2
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/render_v2.py'
      - 'scripts/render_v2_reviewed.py'
      - 'stories/episode.json'
      - 'requirements.txt'
      - '.github/workflows/render.yml'
permissions:
  contents: read
concurrency:
  group: fox-render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Render V2 with trimmed neural voice and verify video
        run: python scripts/render_v2_reviewed.py
      - name: Save MP4 and quality-control report (not published)
        uses: actions/upload-artifact@v4
        with:
          name: fox-short-v2-review
          path: |
            output/short.mp4
            output/metadata.json
          if-no-files-found: error
          retention-days: 3
